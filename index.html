<!DOCTYPE html>
<html>
<head>
    <title>Interactive FAQ</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
                                                      
<body class="min-h-screen bg-gradient-to-t from-blue-900 to-olive-800 via-cyan-400 flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-96">

        <h2 class="text-2xl font-bold text-center bg-gradient-to-r from-teal-400 via-red-600 to-rose-600 bg-clip-text text-transparent mb-6">
           College Sports Portal 
        </h2>

        <p class="text-center mb-5 text-gray-600">
            Some Questions for sports 
        </p>

        <!-- FAQ 1 -->
        <div class="mb-3">
            <button class="question w-full text-left p-3 bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded">
                When the trials of cricket schedule for university games?
            </button>

            <p class="answer hidden p-3 bg-purple-50">
                Trials for cricket are schedule on 5 sept after 2pm .
            </p>
        </div>

        <!-- FAQ 2 -->
        <div class="mb-3">
            <button class="question w-full text-left p-3 bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded">
                What are the main instruction for trials ?
            </button>

            <p class="answer hidden p-3 bg-purple-50">
                The main instruction for cricket trials are keep your own kit and players registerd on Bharat sports.
            </p>
        </div>

        <!-- FAQ 3 -->
        <div class="mb-3">
            <button class="question w-full text-left p-3 bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded">
                Where can I check other sports trials schedule?
            </button>

            <p class="answer hidden p-3 bg-purple-50">
                You can check your schedule on the sports group of college.
            </p>
        </div>

    </div>


    <script>

        // Get all questions
        let questions = document.querySelectorAll(".question");

        // Add click event to each question
        questions.forEach(function(question) {

            question.addEventListener("click", function() {

                // Get the answer
                let answer = question.nextElementSibling;

                // Show / Hide answer
                answer.classList.toggle("hidden");

            });

        });

    </script>

</body>
</html>
